<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>I Love You</title>
        <style>
            html, body { margin: 0; height: 100%; background: #060208; }
            body {display: flex; align-items: center; justify-content: center;}
            canvas { width: min(100vw, 100vh); height: min(100vw, 100vh);}
        </style>
    </head>
    <body>
        <canvas id="c"></canvas>
        <script>
            const SC = 21, OY = 20, DURATION = 10, TICK = 16, ANIM = 42, LIFT = 34, GAP = 7;
            const SIZES = [9, 10, 11, 12];
            const FONT = "Arial', 'Noto Sans', 'sans-serif";
            const BG = "#060208";
            const W = 800;
            const PX = 4 / 3; 
            
            const canvas = document.getElementById("c");
            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvas.height = W * dpr;
            const ctx = canvas.getContext("2d");
            ctx.scale(dpr, dpr);
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            let seed = 11;
            const rand = () => {
            seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
            let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
            const uniform = (a, b) => a + (b - a) * rand();
            const choice = (arr) => arr[Math.floor(rand() * arr.length)];
            const shuffle = (arr) => {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(rand() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            };
            
            const PHRASES = [
            "I love you",
            "Seni seviyorum",
            "Anh yêu em",
            "Em yêu anh",
            "Rwy'n dy garu di",
            "Ikh hob dikh lib",
            "Mo nifẹ rẹ",
            "I love you",
            "Te amo",
            "Je t'aime",
            "Ich liebe dich",
            "Ti amo",
            "Eu te amo",
            "Ik hou van jou",
            "Jeg elsker dig",
            "Jeg elsker deg",
            "Jag älskar dig",
            "Minä rakastan sinua",
            "Kocham cię",
            "Miluji tě",
            "Ľúbim ťa",
            "Szeretlek",
            "Te iubesc",
            "Обичам те",
            "Volim te",
            "Volim te",
            "Волим те",
            "Të dua",
            "Σ' αγαπώ",
            "Я тебя люблю",
            "Я тебе кохаю",
            "Я цябе кахаю",
            "Я люблю цябе",
            "Mənim sənirdən xoşum gəlir",
            "Seni seviyorum",
            "Me gusta ti",
            "Te quiero",
            "T'estimo",
            "Maite zaitut",
            "Je t'aime",
            "Ti amo",
            "Es tevi mīlu",
            "Tave myliu",
            "Armastan sind",
            "Ég elska þig",
            "Eg elski teg",
            "Tha gaol agam ort",
            "Rwy'n dy garu di",
            "Is breá liom tú",
            "Mi amas vin",
            "我爱你",
            "我愛你",
            "愛してる",
            "사랑해",
            "Tôi yêu bạn",
            "ฉันรักคุณ",
            "ខ្ញុំស្រលាញ់អ្នក",
            "خوشم میاد ازت",
            "دوستت دارم",
            "أحبك",
            "אני אוהב אותك",
            "मैं तुमसे प्यार करता हूँ",
            "मैं तुमसे प्यार करती हूँ",
            "मैं तुमसे प्यार करता हूँ",
            "আমি তোমাকে ভালোবাসি",
            "நான் உன்னை காதலிக்கிறேன்",
            "నేను నిన్ను ప్రేమిస్తున్నాను",
            "ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ",
            "ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു",
            "මම ඔයාට ආදරෙයි",
            "तुम्हाला माहीत आहे का",
            "માણસાઈ",
            "ਤੁਹਾਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ",
            "مجھے تم سے محبت ہے",
            "Mano nifẹ rẹ",
            "Ina son ka",
            "Mo nifẹ rẹ",
            "A hụrụ m gị n'anya",
            "Ke a go rata",
            "Ndani iwe",
            "Ndimakukonda",
            "Ndinokuda",
            "Ngiyakutsandza",
            "Ke a go rata",
            "Ngiyakuthanda",
            "Ngiyakuthanda",
            "Nakupenda",
            "Aku cinta kamu",
            "Saya sayang awak",
            "Mahal kita",
            "Malo e lelei",
            "Ou te alofa ia te oe",
            "Alofa au ia te oe",
            "Ka aroha ahau ki a koe",
            "Maua te alofa",
            "Kusakihitin",
            "Tsi ge yu i",
            "Bi kigahag",
            "Ch'ha tula",
            "Negligevam",
            "Volim te"
            ];
            
            const fontStr = (size) => `bold ${size * PX}px ${FONT}`;
            const measure = (text, size) => { ctx.font = fontStr(size); return ctx.measureText(text).width; };
            
            const hx = (c) => "rgb(" + c.map(v => Math.round(Math.max(0, Math.min(1, v)) * 255)).join(",") + ")";
            const mix = (a, b, k) => a.map((p, i) => p + (b[i] - p) * k);
            const dim = (c, k) => c.map(v => v * k);
            const clamp = (v) => Math.max(0, Math.min(1, v));
            const BGC = [1, 3, 5].map(i => parseInt(BG.slice(i, i + 2), 16) / 255);
            
            function heart(a) {
            const x = 16 * Math.sin(a) ** 3;
            const y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
            return [x * SC, y * SC + OY];
            }
            const POLY = Array.from({ length: 720 }, (_, i) => heart(2 * Math.PI * i / 720));
            const EDGES = POLY.map((p, i) => [p, POLY[(i + 1) % POLY.length]]);
            const YMAX = Math.max(...POLY.map(p => p[1]));
            const YMIN = Math.min(...POLY.map(p => p[1]));
            const CY = (YMAX + YMIN) / 2;
            
            function spans(y) {
            const xs = [];
            for (const [[x1, y1], [x2, y2]] of EDGES) {
                if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
                xs.push(x1 + (y - y1) * (x2 - x1) / (y2 - y1));
                }
            }
            xs.sort((a, b) => a - b);
            const out = [];
            for (let i = 0; i + 1 < xs.length; i += 2) out.push([xs[i], xs[i + 1]]);
            return out;
            }
            
            function intersect(A, B) {
            const out = [];
            for (const a of A) for (const b of B) {
                const lo = Math.max(a[0], b[0]), hi = Math.min(a[1], b[1]);
                if (hi - lo > 14) out.push([lo, hi]);
            }
            return out;
            }
            
            let queue = [];
            function nextPhrase() {
            if (!queue.length) { queue = PHRASES.slice(); shuffle(queue); }
            return queue.shift();
            }
            
            const radius = (x, y) => Math.hypot(x / (16 * SC), (y - CY) / (14.5 * SC));
            
            function build() {
            const rowH = Math.max(...SIZES) * PX * 1.25 + 4;
            const half = rowH / 2;
            const placed = [];
            
            for (let y = YMAX - half; y > YMIN + half; y -= rowH) {
                const row = intersect(spans(y + half), spans(y - half));
                for (let [lo, hi] of row) {
                lo += 4; hi -= 4;
                let cur = lo + uniform(0, 8);
                const line = [];
                while (true) {
                    let fit = null;
                    for (let k = 0; k < 10; k++) {
                    const text = nextPhrase();
                    const size = choice(SIZES);
                    const w = measure(text, size);
                    if (cur + w <= hi) { fit = { text, size, w }; break; }
                    }
                    if (!fit) break;
                    line.push({ x: cur + fit.w / 2, text: fit.text, size: fit.size, w: fit.w });
                    cur += fit.w + GAP;
                }
                if (!line.length) continue;
            
                if (line.length > 1) {
                    const last = line[line.length - 1];
                    const left = hi - (last.x + last.w / 2);
                    line.forEach((it, i) => { it.x += left * i / (line.length - 1); });
                } else {
                    line[0].x = (lo + hi) / 2;
                }
                line.forEach((it, i) => {
                    placed.push({ x: it.x, y, text: it.text, size: it.size,
                                edge: i === 0 || i === line.length - 1 });
                });
                }
            }
            
            const wine = [0.58, 0.0, 0.09], crimson = [0.90, 0.05, 0.14], blood = [0.98, 0.10, 0.16];
            for (const p of placed) {
                const rad = Math.min(1, radius(p.x, p.y));
                let base = mix(wine, crimson, 0.25 + 0.75 * rad);
                base = mix(base, blood, uniform(0, 0.35) + (p.edge ? 0.3 : 0));
                p.color = base.map(v => Math.min(1, v));
                p.rad = rad;
            }
            
            const edges = placed.filter(p => p.edge);
            const inner = placed.filter(p => !p.edge);
            const ang = (p) => ((Math.atan2(p.x, p.y - CY) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
            edges.sort((a, b) => ang(a) - ang(b));
            inner.forEach(p => { p.k = -p.rad + uniform(0, 0.08); });
            inner.sort((a, b) => a.k - b.k);
            return edges.concat(inner);
            }
            
            const FLASH = [1.0, 0.78, 0.78];
            const ORDER = build();
            const RATE = ORDER.length / (DURATION * 1000 / TICK);
            const spawned = [];
            let nextIdx = 0, acc = 0, lastTime = null, tickAcc = 0;
            const shimmer = new Map(); // item -> expiry time
            let nextShimmer = 0;
            
            function spawn(p) {
            p.f = 0;
            p.dx = uniform(-10, 10);
            spawned.push(p);
            }
            
            function stepItem(p) {
            if (p.f < ANIM) p.f++;
            }
            
            function drawItem(p) {
            const u = clamp(p.f / ANIM);
            const e = 1 - (1 - u) ** 3;
            const c = p.color;
            const x = W / 2 + p.x, y = W / 2 - p.y;
            const px = x + p.dx * (1 - e);
            const py = y - (1 - e) * LIFT;
            const done = u >= 1;
            
            ctx.font = fontStr(p.size);
            ctx.fillStyle = hx(mix(BGC, dim(c, 0.30), e));
            ctx.fillText(p.text, x + 2, y + 3);
            
            ctx.font = fontStr(p.size + 1);
            ctx.fillStyle = hx(mix(BGC, dim(c, 0.20), e * e));
            ctx.fillText(p.text, done ? x : px, done ? y : py);
            
            let col;
            if (done) {
                col = c;
                if (shimmer.has(p)) col = mix(c, FLASH, 0.6);
            } else {
                const flash = 0.75 * Math.sin(Math.PI * clamp((u - 0.55) / 0.45));
                col = mix(mix(BGC, c, e ** 1.5), FLASH, flash);
            }
            ctx.font = fontStr(p.size);
            ctx.fillStyle = hx(col);
            ctx.fillText(p.text, done ? x : px, done ? y : py);
            }
            
            function frame(now) {
            if (lastTime === null) lastTime = now;
            tickAcc += now - lastTime;
            lastTime = now;
            if (tickAcc > 250) tickAcc = 250;
            
            while (tickAcc >= TICK) {
                tickAcc -= TICK;
                if (nextIdx < ORDER.length) {
                acc += RATE;
                while (acc >= 1 && nextIdx < ORDER.length) { acc--; spawn(ORDER[nextIdx++]); }
                }
                spawned.forEach(stepItem);
            }

            if (nextIdx >= ORDER.length && spawned.every(p => p.f >= ANIM) && now >= nextShimmer) {
                const p = choice(spawned);
                shimmer.set(p, now + 260);
                nextShimmer = now + 140;
            }
            for (const [p, t] of shimmer) if (now >= t) shimmer.delete(p);
            
            ctx.fillStyle = BG;
            ctx.fillRect(0, 0, W, W);
            spawned.forEach(drawItem);
            requestAnimationFrame(frame);
            }
            
            requestAnimationFrame(frame);
        </script>
    </body>
</html>
